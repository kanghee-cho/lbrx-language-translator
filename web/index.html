<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LBRX Translator</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main id="app" aria-busy="true">
      <p class="boot-message">LBRX Translator를 준비하고 있습니다.</p>
    </main>

    <template id="settings-template">
      <div class="settings">
        <header class="masthead">
          <div class="wordmark">
            <span class="brand-mark">L↘</span> LBRX <span>TRANSLATOR</span>
          </div>
          <button
            type="button"
            class="icon-button close-window"
            aria-label="설정을 닫고 백그라운드에서 대기"
          >
            ×
          </button>
        </header>
        <section class="intro">
          <span class="eyebrow">A QUIET LANGUAGE COMPANION</span>
          <h1>읽던 자리에서,<br />다른 언어로.</h1>
          <p>
            문장을 선택하고 <kbd class="shortcut">Ctrl C C</kbd><br />필요한
            순간에만 작은 번역창이 나타납니다.
          </p>
        </section>

        <div id="runtime-status" class="runtime-status" role="status"></div>
        <form id="settings-form">
          <section class="setting-section">
            <div class="section-heading">
              <span class="section-number">01</span>
              <h2>번역 언어</h2>
              <span class="section-note">최대 8개 · 한 번에 번역</span>
            </div>
            <label for="languages">원하는 언어를 쉼표로 구분해주세요.</label>
            <input
              id="languages"
              name="languages"
              type="text"
              required
              autocomplete="off"
              spellcheck="false"
              aria-describedby="language-help"
            />
            <div class="language-presets" aria-label="자주 사용하는 언어">
              <button
                type="button"
                class="language-chip"
                data-language="한국어"
                aria-pressed="false"
              >
                한국어
              </button>
              <button
                type="button"
                class="language-chip"
                data-language="English"
                aria-pressed="false"
              >
                English
              </button>
              <button
                type="button"
                class="language-chip"
                data-language="日本語"
                aria-pressed="false"
              >
                日本語
              </button>
              <button
                type="button"
                class="language-chip"
                data-language="Español"
                aria-pressed="false"
              >
                Español
              </button>
              <button
                type="button"
                class="language-chip"
                data-language="简体中文"
                aria-pressed="false"
              >
                简体中文
              </button>
            </div>
            <p class="field-help" id="language-help">
              목록에 없는 언어도 직접 입력할 수 있습니다. 원문 언어는 자동으로
              감지하며 일본어 번역의 한자에는 후리가나를 표시합니다.
            </p>
          </section>

          <section class="setting-section">
            <div class="section-heading">
              <span class="section-number">02</span>
              <h2>Gemini 연결</h2>
              <span class="section-note">Antigravity CLI · Google 로그인</span>
            </div>
            <div class="setup-note">
              <p>
                Google 공식 Antigravity CLI를 설치한 뒤 한 번만 로그인해주세요.
              </p>
              <code>agy</code>
              <p>
                Google AI Pro/Ultra 구독 계정으로 로그인한 뒤 종료합니다. 앱
                실행에는 Node.js가 필요하지 않습니다.
              </p>
            </div>
            <label for="cli-path"
              >CLI 경로 <span class="optional">선택 사항</span></label
            >
            <input
              id="cli-path"
              name="cliPath"
              type="text"
              placeholder="비워두면 자동으로 찾습니다"
              autocomplete="off"
              spellcheck="false"
            />
            <div class="field-row">
              <div>
                <label for="model">Gemini 모델 ID</label
                ><input
                  id="model"
                  name="model"
                  type="text"
                  list="models"
                  required
                  spellcheck="false"
                /><datalist id="models">
                  <option value="gemini-3.8-flash-low"></option>
                  <option value="gemini-3.8-flash-medium"></option>
                  <option value="gemini-4-argon-low"></option>
                </datalist>
              </div>
              <div>
                <label for="timeout"
                  >응답 제한 <span class="optional">초</span></label
                ><input
                  id="timeout"
                  name="timeoutSeconds"
                  type="number"
                  min="15"
                  max="180"
                  required
                />
              </div>
            </div>
            <p class="field-help">
              agy models로 사용 가능한 모델 ID를 확인할 수 있습니다. 구독의 사용
              한도가 적용되며 별도 API 키나 추가 AI 크레딧으로 전환하지
              않습니다.
            </p>
          </section>

          <section class="setting-section">
            <div class="section-heading">
              <span class="section-number">03</span>
              <h2>백그라운드 동작</h2>
            </div>
            <label for="interval"
              >C를 두 번 누르는 간격 <span class="optional">ms</span></label
            >
            <input
              id="interval"
              class="short-input"
              name="doubleCopyMs"
              type="number"
              min="200"
              max="1000"
              step="50"
              required
            />
            <p class="field-help" id="shortcut-help">
              Ctrl을 누른 채 C를 두 번 누릅니다. 일반 복사는 그대로 동작합니다.
              Esc로 번역창을 닫습니다.
            </p>
            <label class="consent-label"
              ><input id="consent" name="consent" type="checkbox" /><span
                >단축키를 눌렀을 때 선택한 텍스트를 Google에 전송하는 데
                동의합니다.</span
              ></label
            >
            <p class="field-help">
              클립보드를 주기적으로 읽지 않습니다. 앱은 번역 기록을 저장하지
              않지만 Antigravity의 세션 기록과 Google의 데이터 정책이
              적용됩니다. CLI의 전역 규칙·훅·플러그인도 적용될 수 있으므로
              번역용으로 정리된 CLI 환경을 사용해주세요.
            </p>
            <button type="button" id="permissions" class="text-button" hidden>
              macOS 입력 권한 설정 열기
            </button>
          </section>

          <footer class="settings-footer">
            <div class="actions">
              <button type="button" id="check-cli" class="secondary-button">
                CLI 설치 확인</button
              ><button type="submit" id="save" class="primary-button">
                설정 저장 <span aria-hidden="true">↗</span>
              </button>
            </div>
            <p
              id="feedback"
              class="feedback"
              role="status"
              aria-live="polite"
            ></p>
            <p class="footnote">
              창을 닫아도 트레이에서 대기합니다. 종료는 트레이 메뉴에서.
            </p>
          </footer>
        </form>
      </div>
    </template>

    <template id="tooltip-template">
      <article class="popup">
        <header class="popup-header" data-tauri-drag-region>
          <div class="popup-brand" data-tauri-drag-region>
            <span class="status-dot"></span> LBRX <span>TRANSLATE</span>
          </div>
          <button
            type="button"
            class="icon-button close-window"
            aria-label="번역창 닫기"
          >
            ×
          </button>
        </header>
        <div class="popup-content">
          <p id="source" class="source" dir="auto" hidden></p>
          <div
            id="translation-status"
            class="translation-status"
            role="status"
            aria-live="polite"
          >
            <span class="spinner" aria-hidden="true"></span
            ><span id="loading-message">선택한 문장을 가져오는 중</span>
          </div>
          <div id="translations" aria-live="polite"></div>
          <p
            id="translation-error"
            class="translation-error"
            role="alert"
            hidden
          ></p>
        </div>
        <footer class="popup-footer">
          <span>GEMINI · GOOGLE ACCOUNT</span><span><kbd>Esc</kbd> 닫기</span>
        </footer>
      </article>
    </template>
  </body>
</html>
