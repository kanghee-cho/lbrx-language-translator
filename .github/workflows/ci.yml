name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:version -- "$RELEASE_TAG"
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Package Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          $binary = 'src-tauri\target\x86_64-pc-windows-msvc\release\lbrx-language-translator.exe'
          $info = (Get-Item $binary).VersionInfo
          if ($info.ProductVersion -ne $env:VERSION -or $info.FileVersion -notin @($env:VERSION, "$env:VERSION.0")) {
            throw 'Windows executable version does not match the manifests.'
          }
          Compress-Archive -Path $binary, LICENSE, README.md -DestinationPath "dist\LBRX-Translator_$($env:VERSION)_windows-x64-portable.zip"
          $installers = @(Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis' -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          Copy-Item $installers[0].FullName "dist\LBRX-Translator_$($env:VERSION)_windows-x64-setup.exe"
      - name: Package macOS downloads
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/LBRX Translator.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")" = "$VERSION"
          architectures="$(lipo -archs "$app/Contents/MacOS/lbrx-language-translator")"
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]]
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/LBRX-Translator_${VERSION}_macos-universal.app.zip"
          images=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          cp "${images[0]}" "dist/LBRX-Translator_${VERSION}_macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: LBRX-Translator-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
